<div
  #fakeContainer
  class="fake-cursor-container"
  [ngClass]="showRealCursor ? 'show-real-cursor' : ''"
>
  <div
    #fakeCursor
    class="fake-cursor"
    [style.left.px]="position.x"
    [style.top.px]="position.y"
  >
    <img
      alt="fake-cursor"
      height="32"
      src="assets/motion/cursor-default.svg"
      width="32"
    />
  </div>
  <ng-content />
</div>
