<ae-card>
  <h3>Images for colorblindness</h3>
  <p>
    Use the gallery below to see how colorblindness affects the way people see the world. Try to guess what needs to change in
    order to fix the image.
  </p>

  <div class="gallery">
    <p-galleria
      [autoPlay]="true"
      [circular]="true"
      [containerStyle]="{ 'max-width': '880px' }"
      [numVisible]="5"
      [responsiveOptions]="responsiveOptions"
      [showItemNavigators]="true"
      [showItemNavigatorsOnHover]="true"
      [value]="images"
    >
      <ng-template
        let-item
        pTemplate="item"
      >
        <img
          height="880"
          width="880"
          [alt]="item.alt"
          [ngStyle]="{ width: '100%' }"
          [src]="'/assets/colorblind/' + item.itemImageSrc"
          [title]="item.title"
        />
      </ng-template>
      <ng-template
        let-item
        pTemplate="thumbnail"
      >
        <div class="grid grid-nogutter justify-content-center">
          <img
            height="100"
            width="100"
            [alt]="item.alt"
            [src]="'/assets/colorblind/' + (item.thumbnailImageSrc ?? item.itemImageSrc)"
          />
        </div>
      </ng-template>
    </p-galleria>
  </div>
</ae-card>
