<div
  class="bg-surface-0 dark:bg-surface-900 p-6 shadow rounded-border ae-card"
  [ngClass]="{ spacing: config()?.spacing ?? false }"
>
  @if (config()?.title?.length) {
    <div class="text-3xl font-medium text-surface-900 dark:text-surface-0 mb-4">{{ config()?.title }}</div>
  }
  <ng-content />
</div>
