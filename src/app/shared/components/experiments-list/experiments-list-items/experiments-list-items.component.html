<ul class="list-disc pl-4">
  @for (item of list(); track item.key) {
    <li>
      <a
        [ngClass]="item.type === 'url' ? 'text-primary' : 'text-gray-400/50 cursor-not-allowed'"
        [routerLink]="[item.data.url]"
        >{{ item.label }}<br /><span class="text-sm text-black dark:text-white">{{ item.data.explanation }}</span></a
      >

      @if (item.children && item.children.length > 0) {
        <ae-experiments-list-items [list]="item.children" />
      }
    </li>
  } @empty {
    <li>No experiments found</li>
  }
</ul>
