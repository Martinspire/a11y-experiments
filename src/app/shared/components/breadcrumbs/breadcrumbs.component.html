<ul class="list-none p-0 m-0 flex items-center font-medium mb-4">
  <li>
    <a
      class="text-surface-500 dark:text-surface-300 no-underline leading-normal cursor-pointer"
      [routerLink]="['/']"
    >
      <i class="pi pi-home"></i>
    </a>
  </li>
  <li class="px-2">
    <i class="pi pi-angle-right text-surface-500 dark:text-surface-300 leading-normal"></i>
  </li>

  @for (crumb of breadcrumbs; track $index) {
    <li>
      @if ($index !== breadcrumbs.length - 1) {
        <a
          class="text-surface-500 dark:text-surface-300 no-underline leading-normal cursor-pointer"
          [routerLink]="crumb.url"
          >{{ crumb.label }}</a
        >
      } @else {
        <span class="text-surface-500 dark:text-surface-300 leading-normal">{{ crumb.label }}</span>
      }
    </li>
    @if ($index < breadcrumbs.length - 1) {
      <li class="px-2">
        <i class="pi pi-angle-right text-surface-500 dark:text-surface-300 leading-normal"></i>
      </li>
    }
  }
</ul>
